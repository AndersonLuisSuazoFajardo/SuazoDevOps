name: CI Notificacion DevOps

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node index.js

      - name: Enviar notificacion a ntfy
        run: |
          curl -H "Title: Nuevo Push en main 🚀" \
               -H "Priority: 5" \
               -d "Push realizado en ${{ github.repository }} por ${{ github.actor }}" \
               https://ntfy.sh/devops-itla

